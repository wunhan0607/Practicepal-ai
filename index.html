const catalog=JSON.parse(document.getElementById('catalog').textContent), KEY='practicepal_mvp_v1', RELEASE_KEY='practicepal_integrated_v2';
let originalCloudState=null,db={students:[],lessons:[]},cloudReady=false,cloudError=false;
function normalizeState(raw) {
  const students=(raw?.students||[]).map(s=>({
    ...s,id:String(s.id),level:s.level||'Beginner',
    exam:s.exam==='ABRSM 2027–28'?'ABRSM':'none',
    grade:String(s.abrsmGrade||s.grade||'1'),
    pieces:(s.pieces||s.abrsmPieces||(s.abrsmPiece?[s.abrsmPiece]:[])).map(x=>String(x).split(' ')[0]),
    books:s.books||[],methods:s.methods||[]
  }));
  return {students,lessons:raw?.integratedLessons||raw?.lessonsFlat||[]};
}
function getOfflineState(){
  try{
    const v=JSON.parse(localStorage.getItem(RELEASE_KEY)||'null');
    if(v?.students&&v?.lessons)return v;
    const legacy=JSON.parse(localStorage.getItem(KEY)||'null');
    if(legacy?.students){originalCloudState=legacy;return normalizeState(legacy);}
  }catch(e){console.warn('Could not load local cache',e)}
  return {students:[],lessons:[]};
}
db=getOfflineState();
async function bootCloud(){
 try{
  const r=await fetch('/api/data',{cache:'no-store'});
  if(r.ok){
    originalCloudState=await r.json();
    db=normalizeState(originalCloudState);
    cloudReady=true;
    localStorage.setItem(RELEASE_KEY,JSON.stringify(db));
    document.getElementById('syncStatus').textContent='Cloud connected';
  }else if(r.status===404){
    cloudReady=true;
    originalCloudState={students:[],selectedProfileId:null};
    document.getElementById('syncStatus').textContent='Cloud ready · no saved profiles';
  }else throw Error('Cloud returned '+r.status);
 }catch(e){
  cloudError=true;
  document.getElementById('syncStatus').textContent='Offline: local changes only';
  document.getElementById('dataNotice').textContent='Cloud data could not be verified. Do not deploy until tested.';
 }
 render();
 await loadCalendar();
}
async function loadCalendar(){
 const status=document.getElementById('calendarStatus'),button=document.getElementById('calendarConnectBtn');
 try{
  const r=await fetch('/api/google/events',{cache:'no-store'});
  if(r.status===401){status.textContent='Not connected';return}
  if(!r.ok)throw Error('Calendar connection failed');
  const d=await r.json();status.textContent='Connected · read-only';button.style.display='none';
  const event=(d.events||[]).find(e=>/^Piano Lesson:/i.test(e.summary||''));
  if(event)document.getElementById('nextLessonText').textContent='Upcoming: '+event.summary;
 }catch(e){status.textContent='Calendar unavailable in this preview';}
}

const uid=()=>Math.random().toString(36).slice(2,10);
let page='students',editId=null,studentId='',lesson={general:[],skills:[blank()],exam:{},plan:'',examMethod:''},examPiece='';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>{
 localStorage.setItem(RELEASE_KEY,JSON.stringify(db));
 if(!cloudReady){document.getElementById('syncStatus').textContent='Saved locally only';return}
 const old=originalCloudState||{};
 const originals=new Map((old.students||[]).map(s=>[String(s.id),s]));
 const students=db.students.map(s=>{
   const previous=originals.get(String(s.id))||{};
   const updated={...previous,name:s.name,level:s.level,books:s.books,methods:s.methods};
   updated.id=previous.id??s.id;
   updated.exam=s.exam==='ABRSM'?'ABRSM 2027–28':'None';
   updated.abrsmGrade=s.exam==='ABRSM'?s.grade:null;
   updated.abrsmPieces=s.exam==='ABRSM'?(s.pieces||[]).map(id=>{
     const p=(catalog[s.grade]||[]).find(x=>x.id===id);
     return p?id+' '+p.name:id;
   }):[];
   updated.abrsmPiece=updated.abrsmPieces[0]||null;
   updated.lessons=previous.lessons||[];
   return updated;
 });
 const payload={...old,students,integratedLessons:db.lessons,selectedProfileId:old.selectedProfileId??(students[0]?.id||null)};
 fetch('/api/data',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
   .then(r=>{if(!r.ok)throw Error('Cloud save failed');originalCloudState=payload;document.getElementById('syncStatus').textContent='Cloud saved';})
   .catch(e=>{console.error(e);document.getElementById('syncStatus').textContent='Cloud save failed · local copy kept';});
};const student=()=>db.students.find(s=>s.id===studentId);
function tab(x){page=x;render()}function render(){['Students','Lesson','History'].forEach(t=>$('#tab'+t).classList.toggle('active',page===t.toLowerCase()));if(page==='students')studentsUI();if(page==='lesson')lessonUI();if(page==='history')historyUI()}

 const sentences=[`Hi! Here's a quick update on ${name}'s piano lesson 😊`];
 // Lead with the book/piece title and retain the teacher's own page/line wording.
 // Vary sentence structure; never turn an area for improvement into a completed skill.
 sections.forEach((sec,i)=>{
   const place=`${sec.title}${sec.unit}`;
   const progress=sec.progress,need=sec.improve;
   if(!progress&&!need){sentences.push(`${place}: covered in today's lesson.`);return}
   if(i===0){
     sentences.push(`${place}: ${progress?`today we practised ${progress}`:`we'll keep focusing on ${need}`}.`);
   }else if(i===1){
     sentences.push(`${place}: ${progress?`we also covered ${progress}`:`more practice is needed with ${need}`}.`);
   }else{
     sentences.push(`${place}: ${progress?`we focused on ${progress}`:`we'll continue practising ${need}`}.`);
   }
   if(progress&&need)sentences.push(i%2===0?`We'll keep working on ${need}.`:`${need.charAt(0).toUpperCase()+need.slice(1)} still needs some attention.`);
 });
 const methods=unique(r.practiceMethods||[]);
 const METHOD_PHRASES={
  'Slow practice':'practising slowly',
  'Small sections':'working on short sections',
  'Hands separately':'playing hands separately first',
  'Clap / count first':'clapping or counting the rhythm first',
  'Name notes before playing':'naming the notes before playing',
  'Metronome practice':'using a metronome',
  'Repeat difficult passages':'repeating the difficult passages',
  'Rhythm variation':'trying rhythm variations',
  'Hands together':'practising hands together'
 };
 const familiar=methods.filter(m=>Object.hasOwn(METHOD_PHRASES,m)).map(m=>METHOD_PHRASES[m]);
 const custom=methods.filter(m=>!Object.hasOwn(METHOD_PHRASES,m));
 if(familiar.length)sentences.push(`At home, try ${format(familiar)}.`);
 for(const customMethod of custom)sentences.push(`${customMethod.charAt(0).toUpperCase()+customMethod.slice(1)}.`);
 if(r.exam?.length&&r.examMethod?.trim())sentences.push(`${tidy(r.examMethod)}.`);
 if(r.planDays&&r.planTimes)sentences.push(`Please aim for ${r.planDays} day${Number(r.planDays)===1?'':'s'} a week, ${r.planTimes} repetition${Number(r.planTimes)===1?'':'s'} each time.`);
 else if(r.planDays)sentences.push(`Please aim for ${r.planDays} day${Number(r.planDays)===1?'':'s'} of practice each week.`);
 else if(r.planTimes)sentences.push(`Please aim for ${r.planTimes} repetition${Number(r.planTimes)===1?'':'s'} during practice.`);
 sentences.push('Thank you!');
 return sentences.join(' ');
}

function preview(){const r=collect();$('#preview').textContent=r&&(r.general.length||r.exam.length||(r.skills||[]).length)?message(r):'No lesson details selected. Nothing to generate.'}
async function copyPreview(){const t=$('#preview')?.textContent||'';if(!t||t.startsWith('No lesson')||t==='Preview will appear here.')return alert('Preview a message first.');try{if(!navigator.clipboard?.writeText)throw Error('Clipboard API unavailable');await navigator.clipboard.writeText(t);alert('Copied!')}catch(e){const input=document.createElement('textarea');input.value=t;input.style.position='fixed';input.style.opacity='0';document.body.appendChild(input);input.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}input.remove();if(ok)alert('Copied!');else{const preview=$('#preview');const range=document.createRange();range.selectNodeContents(preview);const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);alert('Message selected. Press Command+C (Mac) or Ctrl+C to copy.')}}}
function saveLesson(){const r=collect();if(!r||!(r.general.length||r.exam.length||(r.skills||[]).length))return alert('Select at least one lesson detail. Empty sections are not saved.');db.lessons.unshift(r);save();alert('Lesson saved. Check the sync status before closing this page.');tab('history')}
function historyUI(){const records=db.lessons.filter(r=>!studentId||r.studentId===studentId);$('#view').innerHTML=`<div class="card"><h2>Lesson History</h2><label>Student</label><select id="historyStudent"><option value="">All students</option>${db.students.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select>${records.map(r=>`<div class="section"><div class="row"><b>${esc(r.studentName)}</b><span class="muted">${esc(r.date)}</span></div><div class="preview">${esc(message(r))}</div></div>`).join('')||'<p class="muted">No saved lessons.</p>'}</div>`;$('#historyStudent').value=studentId;$('#historyStudent').onchange=()=>{studentId=$('#historyStudent').value;historyUI()}}
// Render the local preview immediately, before any optional cloud request.
try { render(); } catch(e) { document.getElementById('syncStatus').textContent='Startup error: '+e.message; console.error(e); }
if(location.protocol==='file:'){
  document.getElementById('syncStatus').textContent='Local preview · browser only';
  document.getElementById('dataNotice').textContent='This downloaded file cannot connect to the live cloud. Test with sample students only.';
}else{
  bootCloud();
}
